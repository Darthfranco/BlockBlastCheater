
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast Strategist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden; /* Prevent bounce scrolling on mobile */
            touch-action: none; /* Disable default gestures */
            height: 100dvh;
        }
        
        #root {
            height: 100%;
        }

        .block-3d {
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.3),
                inset 0 -2px 4px rgba(0,0,0,0.3),
                0 4px 6px -1px rgba(0,0,0,0.5);
        }

        .clearing-block {
            animation: pop-out 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop-out {
            0% { transform: scale(1); opacity: 1; filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; filter: brightness(5); }
        }

        .tray-piece-transition {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .active-drag {
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
            pointer-events: none;
        }
    </style>
<script type="importmap">

</html>
